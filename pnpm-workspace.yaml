packages:
  - .

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260821.1"
  - '@cloudflare/vitest-plugin@1.0.0'
  - miniflare@5.20260820.0-alpha
  - wrangler@4.125.0

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10

peerDependencyRules:
  allowedVersions:
    typescript: 7.0.2
    vite: 0.2.9
